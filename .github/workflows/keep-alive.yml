name: Keep Supabase project active

# Supabase free-tier projects auto-pause after 7 days with no activity.
# This app is used in bursts once a month, so without this it would pause
# in between. Pinging a public Edge Function weekly (which queries the
# database) counts as activity and keeps the project from pausing.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping confirm Edge Function
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://nktfcylukxootchitaig.supabase.co/functions/v1/confirm/keep-alive-ping")
          echo "Response status: $status"
          # Any real HTTP response (including the expected 404 for an
          # unknown token) means the function ran and queried the database.
          # Only a connection failure (curl reports 000) should fail the job.
          if [ "$status" = "000" ]; then
            echo "::error::No response from Supabase — connection failed"
            exit 1
          fi
