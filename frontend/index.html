<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wohnheim Präsenzbestätigung</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .landing {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: linear-gradient(160deg, #EFF6FF 0%, #F7F6F2 60%);
      text-align: center;
      padding: 32px 16px;
    }
    .landing h1 { font-size: 22px; font-weight: 700; }
    .landing p { color: var(--ink-soft); font-size: 14px; max-width: 360px; }
    .landing a {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 22px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="landing">
    <h1>Wohnheim Präsenzbestätigung</h1>
    <p>Bewohner bestätigen ihre Anwesenheit über den QR-Code an ihrer Zimmertür. Die Verwaltung verwaltet alle Zimmer über das Dashboard.</p>
    <a href="admin.html">Zum Verwaltung Dashboard →</a>
  </div>
</body>
</html>
